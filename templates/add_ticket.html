{% extends "base.html" %}

{% block title %}Submit Ticket - IT Management System{% endblock %}

{% block content %}
<div style="max-width: 800px; margin: 0 auto;">
    <h2 style="margin-bottom: 2rem; color: #2c3e50;">🎫 Submit New Support Ticket</h2>

    <div class="card">
        <form method="POST" action="{{ url_for('add_ticket') }}">
            <div class="form-group">
                <label>Title <span class="required">*</span></label>
                <input type="text" name="title" placeholder="e.g., Wi-Fi not working in conference room" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" placeholder="Provide detailed information about the issue..."></textarea>
            </div>

            <div class="form-group">
                <label>Category <span class="required">*</span></label>
                <select name="category" required>
                    <option value="">Select a category...</option>
                    {% for category in ticket_categories %}
                        <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Priority <span class="required">*</span></label>
                <select name="priority" required>
                    {% for priority in priority_levels %}
                        <option value="{{ priority }}" {% if priority == 'Medium' %}selected{% endif %}>
                            {{ priority }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Submitted By <span class="required">*</span></label>
                <input type="text" name="submitted_by" placeholder="Your name" required>
            </div>

            <div style="display: flex; gap: 1rem;">
                <button type="submit" class="btn btn-success">📤 Submit Ticket</button>
                <a href="{{ url_for('tickets_list') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
